# ServiceAccount with Workload Identity Federation annotations
# Supports AWS IRSA, Azure Workload Identity, and GCP Workload Identity
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cspm-aggregator
  namespace: cspm-system
  annotations:
    # AWS IRSA - IAM Role for Service Accounts
    # Replace with your AWS account ID and role name
    eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/cspm-aggregator-role"
    
    # Azure Workload Identity
    # Replace with your Azure tenant and client IDs
    azure.workload.identity/client-id: "YOUR_AZURE_CLIENT_ID"
    azure.workload.identity/tenant-id: "YOUR_AZURE_TENANT_ID"
    
    # GCP Workload Identity
    # Replace with your GCP project and service account
    iam.gke.io/gcp-service-account: "cspm-aggregator@YOUR_PROJECT.iam.gserviceaccount.com"
  labels:
    azure.workload.identity/use: "true"
automountServiceAccountToken: true
