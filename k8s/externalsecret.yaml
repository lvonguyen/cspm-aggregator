# External Secrets - Pulls secrets from Azure Key Vault / AWS Secrets Manager / GCP Secret Manager
# Requires External Secrets Operator: https://external-secrets.io/
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cspm-aggregator-secrets
  namespace: cspm-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-keyvault  # Change based on your secret store
    kind: ClusterSecretStore
  target:
    name: cspm-aggregator-secrets
    creationPolicy: Owner
  data:
    # Anthropic API Key for LLM scoring
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: cspm-anthropic-api-key
    
    # Asana PAT for task sync
    - secretKey: ASANA_PAT
      remoteRef:
        key: cspm-asana-pat
    
    # Microsoft Graph credentials for email
    - secretKey: MAIL_CLIENT_SECRET
      remoteRef:
        key: cspm-mail-client-secret

---
# Alternative: Standard Kubernetes Secret (for dev/testing only)
# In production, use External Secrets or sealed-secrets
apiVersion: v1
kind: Secret
metadata:
  name: cspm-aggregator-secrets-dev
  namespace: cspm-system
  annotations:
    note: "DEV ONLY - Use ExternalSecret in production"
type: Opaque
stringData:
  ANTHROPIC_API_KEY: "placeholder-replace-me"
  ASANA_PAT: "placeholder-replace-me"
  MAIL_CLIENT_SECRET: "placeholder-replace-me"
