<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 600">
  <style>
    text { font-family: Georgia, 'Times New Roman', serif; font-size: 11px; fill: #333; }
    .title { font-size: 18px; font-weight: 700; fill: #1a1a1a; }
    .section-title { font-size: 12px; font-weight: 600; fill: #64748b; text-transform: uppercase; letter-spacing: 0.5px; }
    .box { fill: #fff; stroke: #e2e8f0; stroke-width: 1.5; }
    .input { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2; }
    .matrix { fill: #f8fafc; stroke: #475569; stroke-width: 2; }
    .escalation { fill: #fef3c7; stroke: #f59e0b; stroke-width: 2; }
    .output { fill: #ecfdf5; stroke: #10b981; stroke-width: 2; }
    .p1 { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; }
    .p2 { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; }
    .p3 { fill: #fefce8; stroke: #ca8a04; stroke-width: 2; }
    .p4 { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; }
    .p5 { fill: #f8fafc; stroke: #64748b; stroke-width: 2; }
    .arrow { stroke: #94a3b8; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .arrow-escalate { stroke: #f59e0b; stroke-width: 2; fill: none; marker-end: url(#arrow-orange); }
    .label { font-size: 9px; fill: #64748b; font-weight: 500; }
    .component-title { font-size: 11px; font-weight: 600; fill: #1e293b; }
    .tech-label { font-size: 9px; fill: #94a3b8; }
    .matrix-cell { font-size: 14px; font-weight: 700; }
    .matrix-header { font-size: 10px; font-weight: 600; fill: #475569; }
    .section-box { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1; stroke-dasharray: 8,4; }
  </style>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#f59e0b"/>
    </marker>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fafbfc"/>
      <stop offset="100%" style="stop-color:#f1f5f9"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="600" fill="url(#bg-gradient)"/>

  <!-- Title -->
  <text x="500" y="32" text-anchor="middle" class="title">Data Flow Diagram - Priority Matrix Calculation</text>

  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <!-- INPUTS -->
  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <rect x="30" y="60" width="180" height="250" class="section-box" rx="10"/>
  <text x="50" y="85" class="section-title">Inputs</text>

  <!-- Risk Severity -->
  <rect x="45" y="100" width="150" height="90" class="input" rx="6"/>
  <text x="120" y="125" text-anchor="middle" class="component-title">Risk Severity</text>
  <text x="55" y="145" class="tech-label">CRITICAL - Immediate threat</text>
  <text x="55" y="160" class="tech-label">HIGH - Significant risk</text>
  <text x="55" y="175" class="tech-label">MEDIUM - Moderate risk</text>
  <text x="55" y="190" class="tech-label">LOW / INFO</text>

  <!-- Complexity Tier -->
  <rect x="45" y="200" width="150" height="90" class="input" rx="6"/>
  <text x="120" y="225" text-anchor="middle" class="component-title">Complexity Tier</text>
  <text x="55" y="245" class="tech-label">Tier 1 - Full automation</text>
  <text x="55" y="260" class="tech-label">Tier 2 - Partial automation</text>
  <text x="55" y="275" class="tech-label">Tier 3 - Manual execution</text>

  <path d="M 210 185 L 250 185" class="arrow"/>

  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <!-- PRIORITY MATRIX -->
  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <rect x="245" y="60" width="290" height="280" class="section-box" rx="10"/>
  <text x="265" y="85" class="section-title">Base Priority Matrix</text>

  <!-- Matrix Grid -->
  <rect x="265" y="100" width="250" height="220" class="matrix" rx="6"/>

  <!-- Headers -->
  <text x="320" y="120" class="matrix-header">Tier 1</text>
  <text x="390" y="120" class="matrix-header">Tier 2</text>
  <text x="460" y="120" class="matrix-header">Tier 3</text>

  <!-- Row labels -->
  <text x="280" y="155" class="matrix-header">CRIT</text>
  <text x="280" y="195" class="matrix-header">HIGH</text>
  <text x="280" y="235" class="matrix-header">MED</text>
  <text x="280" y="275" class="matrix-header">LOW</text>
  <text x="280" y="310" class="matrix-header">INFO</text>

  <!-- Matrix cells - Row 1 (CRITICAL) -->
  <rect x="310" y="135" width="45" height="30" class="p1" rx="4"/>
  <text x="332" y="155" text-anchor="middle" class="matrix-cell" fill="#dc2626">P1</text>
  <rect x="375" y="135" width="45" height="30" class="p1" rx="4"/>
  <text x="397" y="155" text-anchor="middle" class="matrix-cell" fill="#dc2626">P1</text>
  <rect x="440" y="135" width="45" height="30" class="p2" rx="4"/>
  <text x="462" y="155" text-anchor="middle" class="matrix-cell" fill="#ea580c">P2</text>

  <!-- Matrix cells - Row 2 (HIGH) -->
  <rect x="310" y="175" width="45" height="30" class="p1" rx="4"/>
  <text x="332" y="195" text-anchor="middle" class="matrix-cell" fill="#dc2626">P1</text>
  <rect x="375" y="175" width="45" height="30" class="p2" rx="4"/>
  <text x="397" y="195" text-anchor="middle" class="matrix-cell" fill="#ea580c">P2</text>
  <rect x="440" y="175" width="45" height="30" class="p3" rx="4"/>
  <text x="462" y="195" text-anchor="middle" class="matrix-cell" fill="#ca8a04">P3</text>

  <!-- Matrix cells - Row 3 (MEDIUM) -->
  <rect x="310" y="215" width="45" height="30" class="p3" rx="4"/>
  <text x="332" y="235" text-anchor="middle" class="matrix-cell" fill="#ca8a04">P3</text>
  <rect x="375" y="215" width="45" height="30" class="p4" rx="4"/>
  <text x="397" y="235" text-anchor="middle" class="matrix-cell" fill="#16a34a">P4</text>
  <rect x="440" y="215" width="45" height="30" class="p4" rx="4"/>
  <text x="462" y="235" text-anchor="middle" class="matrix-cell" fill="#16a34a">P4</text>

  <!-- Matrix cells - Row 4 (LOW) -->
  <rect x="310" y="255" width="45" height="30" class="p4" rx="4"/>
  <text x="332" y="275" text-anchor="middle" class="matrix-cell" fill="#16a34a">P4</text>
  <rect x="375" y="255" width="45" height="30" class="p5" rx="4"/>
  <text x="397" y="275" text-anchor="middle" class="matrix-cell" fill="#64748b">P5</text>
  <rect x="440" y="255" width="45" height="30" class="p5" rx="4"/>
  <text x="462" y="275" text-anchor="middle" class="matrix-cell" fill="#64748b">P5</text>

  <!-- Matrix cells - Row 5 (INFO) -->
  <rect x="310" y="290" width="45" height="25" class="p5" rx="4"/>
  <text x="332" y="307" text-anchor="middle" class="matrix-cell" fill="#64748b">P5</text>
  <rect x="375" y="290" width="45" height="25" class="p5" rx="4"/>
  <text x="397" y="307" text-anchor="middle" class="matrix-cell" fill="#64748b">P5</text>
  <rect x="440" y="290" width="45" height="25" class="p5" rx="4"/>
  <text x="462" y="307" text-anchor="middle" class="matrix-cell" fill="#64748b">P5</text>

  <path d="M 535 185 L 570 185" class="arrow"/>

  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <!-- ESCALATION RULES -->
  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <rect x="565" y="60" width="180" height="280" class="section-box" rx="10"/>
  <text x="585" y="85" class="section-title">Escalations</text>
  <text x="585" y="100" class="tech-label">Business context bumps</text>

  <rect x="580" y="115" width="150" height="45" class="escalation" rx="6"/>
  <text x="655" y="135" text-anchor="middle" class="component-title">Production Env</text>
  <text x="655" y="152" text-anchor="middle" class="tech-label">+1 priority (max P1)</text>

  <rect x="580" y="170" width="150" height="45" class="escalation" rx="6"/>
  <text x="655" y="190" text-anchor="middle" class="component-title">PCI / PII Data</text>
  <text x="655" y="207" text-anchor="middle" class="tech-label">+1 priority (max P2)</text>

  <rect x="580" y="225" width="150" height="45" class="escalation" rx="6"/>
  <text x="655" y="245" text-anchor="middle" class="component-title">Internet-Facing</text>
  <text x="655" y="262" text-anchor="middle" class="tech-label">+1 priority (max P2)</text>

  <rect x="580" y="280" width="150" height="45" class="escalation" rx="6"/>
  <text x="655" y="300" text-anchor="middle" class="component-title">SLA Overdue</text>
  <text x="655" y="317" text-anchor="middle" class="tech-label">+1 priority</text>

  <path d="M 745 185 L 780 185" class="arrow-escalate"/>

  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <!-- OUTPUT -->
  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <rect x="775" y="60" width="195" height="280" class="section-box" rx="10"/>
  <text x="795" y="85" class="section-title">Output</text>

  <!-- Final Priority -->
  <rect x="790" y="100" width="165" height="55" class="output" rx="6"/>
  <text x="872" y="125" text-anchor="middle" class="component-title">Final Priority</text>
  <text x="872" y="145" text-anchor="middle" class="tech-label">P1-P5 with escalations applied</text>

  <!-- SLA Deadline -->
  <rect x="790" y="165" width="165" height="55" class="output" rx="6"/>
  <text x="872" y="190" text-anchor="middle" class="component-title">SLA Deadline</text>
  <text x="872" y="210" text-anchor="middle" class="tech-label">P1=24h, P2=7d, P3=14d...</text>

  <!-- Queue Assignment -->
  <rect x="790" y="230" width="165" height="55" class="output" rx="6"/>
  <text x="872" y="255" text-anchor="middle" class="component-title">Queue Assignment</text>
  <text x="872" y="275" text-anchor="middle" class="tech-label">auto_remediation, security_review...</text>

  <!-- Auto-Remediation -->
  <rect x="790" y="295" width="165" height="40" class="p1" rx="6"/>
  <text x="872" y="320" text-anchor="middle" class="component-title">Auto-Remediation Ready</text>

  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <!-- SLA TIMELINES (Bottom) -->
  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <rect x="30" y="370" width="940" height="100" class="box" rx="10"/>
  <text x="50" y="395" class="section-title">SLA Timelines by Priority</text>

  <!-- P1 -->
  <rect x="60" y="410" width="160" height="45" class="p1" rx="6"/>
  <text x="140" y="432" text-anchor="middle" class="component-title" fill="#dc2626">P1 - Immediate</text>
  <text x="140" y="448" text-anchor="middle" class="tech-label">24 hours</text>

  <!-- P2 -->
  <rect x="240" y="410" width="160" height="45" class="p2" rx="6"/>
  <text x="320" y="432" text-anchor="middle" class="component-title" fill="#ea580c">P2 - Urgent</text>
  <text x="320" y="448" text-anchor="middle" class="tech-label">7 days</text>

  <!-- P3 -->
  <rect x="420" y="410" width="160" height="45" class="p3" rx="6"/>
  <text x="500" y="432" text-anchor="middle" class="component-title" fill="#ca8a04">P3 - High</text>
  <text x="500" y="448" text-anchor="middle" class="tech-label">14 days</text>

  <!-- P4 -->
  <rect x="600" y="410" width="160" height="45" class="p4" rx="6"/>
  <text x="680" y="432" text-anchor="middle" class="component-title" fill="#16a34a">P4 - Medium</text>
  <text x="680" y="448" text-anchor="middle" class="tech-label">30 days</text>

  <!-- P5 -->
  <rect x="780" y="410" width="160" height="45" class="p5" rx="6"/>
  <text x="860" y="432" text-anchor="middle" class="component-title" fill="#64748b">P5 - Low</text>
  <text x="860" y="448" text-anchor="middle" class="tech-label">90 days</text>

  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <!-- QUEUE ROUTING (Bottom) -->
  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <rect x="30" y="485" width="940" height="75" class="box" rx="10"/>
  <text x="50" y="510" class="section-title">Queue Routing Logic</text>

  <rect x="60" y="525" width="150" height="25" class="output" rx="4"/>
  <text x="135" y="542" text-anchor="middle" class="tech-label">auto_remediation</text>

  <rect x="230" y="525" width="150" height="25" class="p1" rx="4"/>
  <text x="305" y="542" text-anchor="middle" class="tech-label">security_review</text>

  <rect x="400" y="525" width="150" height="25" class="input" rx="4"/>
  <text x="475" y="542" text-anchor="middle" class="tech-label">app_team</text>

  <rect x="570" y="525" width="150" height="25" class="escalation" rx="4"/>
  <text x="645" y="542" text-anchor="middle" class="tech-label">change_board</text>

  <rect x="740" y="525" width="150" height="25" class="box" rx="4"/>
  <text x="815" y="542" text-anchor="middle" class="tech-label">remediation_queue</text>

  <!-- Version & Branding -->
  <text x="970" y="580" text-anchor="end" class="tech-label">v1.0 - 2026-01-08</text>
  <rect x="30" y="565" width="140" height="18" rx="4" style="fill:#e2e8f0"/>
  <text x="100" y="577" text-anchor="middle" fill="#475569" font-size="10" font-weight="600">CSPM Aggregator</text>
</svg>
